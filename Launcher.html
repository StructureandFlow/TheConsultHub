<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Structure and Flow Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font-family:'DM Sans',sans-serif;background:#f7f6f3;color:#1a1a18}.topbar{height:52px;background:#1a1a18;color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px}.brand{font:400 18px 'DM Serif Display',serif}.subtitle{font-size:11px;color:#aaa}.nav{display:flex;gap:5px;margin-left:auto}.nav a,.toolbar button{font:500 11px 'DM Sans',sans-serif;color:#ddd;background:transparent;border:1px solid #4b4b48;border-radius:6px;padding:6px 9px;text-decoration:none;cursor:pointer}.nav a.active,.nav a:hover,.toolbar button:hover{color:#fff;border-color:#aaa;background:#2c2c29}.toolbar{display:flex;gap:6px;margin-left:8px}.workspace{height:calc(100vh - 52px);display:grid;grid-template-columns:minmax(0,1fr) 6px minmax(0,1fr);gap:0}.workspace.single-left{grid-template-columns:minmax(0,1fr) 0 minmax(0,0)}.workspace.single-right{grid-template-columns:minmax(0,0) 0 minmax(0,1fr)}.pane{min-width:0;display:flex;flex-direction:column;background:#fff}.pane-header{height:36px;display:flex;align-items:center;gap:7px;padding:0 10px;border-bottom:1px solid #e5e2dc;font-size:12px;font-weight:600}.dot{width:8px;height:8px;border-radius:50%}.pane-title{flex:1}.pane-actions{display:flex;gap:4px}.pane-actions button{font:11px 'DM Sans',sans-serif;border:0;background:transparent;color:#777;cursor:pointer;padding:3px 5px}.pane-actions button:hover{color:#1a1a18}.frame{flex:1;min-height:0}.frame iframe{width:100%;height:100%;border:0;display:block}.divider{background:#d8d4cc;cursor:col-resize}.single-left .pane-right,.single-right .pane-left{display:none}@media(max-width:700px){.topbar{height:auto;min-height:52px;flex-wrap:wrap;padding:8px}.subtitle{display:none}.nav{order:3;width:100%;margin-left:0}.toolbar{margin-left:auto}.workspace,.workspace.single-left,.workspace.single-right{height:calc(100vh - 84px);grid-template-columns:minmax(0,1fr)}.divider{display:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">Structure and Flow</div><div class="subtitle">Workspace</div>
  <nav class="nav" aria-label="App navigation"><a class="active" href="Launcher.html">Launcher</a><a href="Signal.html">Signal</a><a href="index.html">The Consult</a></nav>
  <div class="toolbar"><button onclick="setLayout('split')" title="Show both apps">Both</button><button onclick="setLayout('left')" title="Show Signal">Signal</button><button onclick="setLayout('right')" title="Show The Consult">Consult</button></div>
</header>
<main class="workspace" id="workspace">
  <section class="pane pane-left"><div class="pane-header"><span class="dot" style="background:#d85a30"></span><span class="pane-title">Signal</span><div class="pane-actions"><button onclick="reloadPane('signal')" title="Reload Signal">Reload</button><button onclick="openPane('signal')" title="Open Signal in a new tab">Open</button></div></div><div class="frame" id="signal-frame"><iframe id="signal-iframe" src="Signal.html" title="Signal"></iframe></div></section>
  <div class="divider"></div>
  <section class="pane pane-right"><div class="pane-header"><span class="dot" style="background:#534ab7"></span><span class="pane-title">The Consult</span><div class="pane-actions"><button onclick="reloadPane('consult')" title="Reload The Consult">Reload</button><button onclick="openPane('consult')" title="Open The Consult in a new tab">Open</button></div></div><div class="frame" id="consult-frame"><iframe id="consult-iframe" src="index.html" title="The Consult"></iframe></div></section>
</main>
<script>
const appUrls={signal:'Signal.html',consult:'index.html'};
function reloadPane(which){document.getElementById(which+'-iframe').src=appUrls[which]+'?refresh='+Date.now()}
function openPane(which){window.open(appUrls[which],'_blank','noopener')}
function setLayout(mode){document.getElementById('workspace').className='workspace'+(mode==='left'?' single-left':mode==='right'?' single-right':'')}
</script>
</body>
</html>
